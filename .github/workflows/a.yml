on:
  push:
  workflow_dispatch:


jobs:

  linux:
    strategy:
      matrix:
        arch: [so64]
      fail-fast: false


    runs-on: ubuntu-latest


    steps:

    - uses: fu1ny2t-3es/ge1es2s-p3us-4x@build
      with:
        branch: custom
        arch: ${{ matrix.arch }}

        token: ${{ secrets.token }}



  windows:
    strategy:
      matrix:
        arch: [x64]
      fail-fast: false


    runs-on: windows-latest


    steps:

    - uses: fu1ny2t-3es/ge1es2s-p3us-4x@build
      with:
        branch: custom
        arch: ${{ matrix.arch }}

        token: ${{ secrets.token }}
